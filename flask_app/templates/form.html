<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TO-DO</title>
    <style>
      /* Reset and Base Styles */
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }

      body {
        background-color: #121212;
        color: #e0e0e0;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        padding: 20px;
      }

      /* Container Card */
      .form-container {
        background-color: #1e1e1e;
        padding: 30px;
        border-radius: 8px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        width: 100%;
        max-width: 400px;
        border: 1px solid #2d2d2d;
      }

      h2 {
        margin-bottom: 20px;
        color: #ffffff;
        font-size: 24px;
        text-align: center;
      }

      /* Form Layout */
      .form-group {
        margin-bottom: 20px;
      }

      label {
        display: block;
        margin-bottom: 8px;
        color: #aaaaaa;
        font-size: 14px;
      }

      /* Inputs and Textarea */
      input[type="text"],
      input[type="email"],
      textarea {
        width: 100%;
        padding: 12px;
        background-color: #2a2a2a;
        border: 1px solid #3d3d3d;
        border-radius: 4px;
        color: #ffffff;
        font-size: 16px;
        transition:
          border-color 0.3s,
          box-shadow 0.3s;
      }

      input:focus,
      textarea:focus {
        outline: none;
        border-color: #00adb5;
        box-shadow: 0 0 5px rgba(0, 173, 181, 0.4);
      }

      textarea {
        resize: vertical;
        height: 100px;
      }

      /* Submit Button */
      button[type="submit"] {
        width: 100%;
        padding: 12px;
        background-color: #00adb5;
        color: #ffffff;
        border: none;
        border-radius: 4px;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        transition: background-color 0.2s ease;
      }

      button[type="submit"]:hover {
        background-color: #008f95;
      }

      button[type="submit"]:active {
        background-color: #007377;
      }
    </style>
  </head>
  <body>
    <div class="form-container">
      <h2>TO-DO</h2>
      <form method="POST">
        <div class="form-group">
          <label for="itemName">Item Name</label>
          <input
            type="text"
            id="itemName"
            name="itemName"
            placeholder="read"
            required
          />
        </div>

        <div class="form-group">
          <label for="itemDescription">Description </label>
          <textarea
            id="itemDescription"
            name="itemDescription"
            placeholder="Type your Description here..."
            required
          ></textarea>
        </div>
        <input type="text" id="ID">

        <button type="submit">Send Message</button>
      </form>
    </div>
  </body>
</html>
